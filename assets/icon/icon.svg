<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131924;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <rect x="0" y="0" width="512" height="512" fill="none" stroke="#D4A017" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Main symbol: Stylized chart/candlestick -->
  <g transform="translate(256, 256)">
    <!-- Candlestick body -->
    <rect x="-48" y="-70" width="96" height="140" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
    
    <!-- Wick -->
    <rect x="-4" y="-120" width="8" height="50" rx="4" fill="url(#accentGradient)"/>
    
    <!-- Wick bottom -->
    <rect x="-4" y="70" width="8" height="50" rx="4" fill="url(#accentGradient)"/>
    
    <!-- Upward arrow indicator -->
    <path d="M 0 -100 L -20 -80 L 20 -80 Z" fill="url(#accentGradient)" opacity="0.9"/>
    
    <!-- Subtle grid lines in background -->
    <g stroke="#D4A017" stroke-width="1" opacity="0.15">
      <line x1="-200" y1="-100" x2="200" y2="-100"/>
      <line x1="-200" y1="0" x2="200" y2="0"/>
      <line x1="-200" y1="100" x2="200" y2="100"/>
    </g>
    
    <!-- K Y R O N initials subtly embedded -->
    <text x="0" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#D4A017" opacity="0.3">KYRON</text>
  </g>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" stroke="url(#accentGradient)" stroke-width="3" fill="none" opacity="0.3"/>
</svg>